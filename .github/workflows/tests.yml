name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (with dev group)
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q
        env:
          JAX_PLATFORMS: cpu
