[project]
name = "endpoint-replay"
version = "0.1.0"
description = "Compressing the recency buffer in deep reinforcement learning, in JAX."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "equinox>=0.13.8",
    "flashbax>=0.1.3",
    "ipykernel>=7.3.0",
    "jax>=0.11.0",
    "matplotlib>=3.8",
    "optax>=0.2.8",
    "pinball-jax",
    "polars>=1.0",
    "tyro>=0.9",
]

[project.optional-dependencies]
# Atari via ale-py's XLA env. macOS-XLA + Linux-CUDA need the PR #707 build, which
# PyPI 0.12.0 lacks: run scripts/install_ale_wheel.sh (it syncs, then force-installs
# the wheel over the PyPI build). Add --extra cuda on a Linux GPU box for CUDA jax.
atari = ["ale-py[xla]>=0.12.0"]
cuda = ["jax[cuda12]==0.11.0"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/experiment", "src/environments"]

[tool.uv.sources]
pinball-jax = { git = "https://github.com/panahiparham/pinball-jax" }
