# Cluster and SLURM settings for `run.py ... --slurm` and `setup_cluster.py`.
#
# Committed, so a run is reproducible from the repo alone. Review [cluster] before
# first use; the rest has working defaults for this repo's experiments.

[cluster]
# An ssh alias that works non-interactively. ControlMaster is recommended: Alliance
# MFA then prompts once per session rather than once per command.
host = "vulcan"

# Everything the cluster knows about this project lives under here - the bare repo,
# the two venvs, results and run snapshots. Deleting it is a full reset. The literal
# $HOME is expanded by the *remote* shell, not this machine's.
root = "$HOME/scratch/online-gsp"

# The account jobs are charged to. Left empty, setup_cluster.py detects the candidates
# from ~/projects on the cluster and tells you what to put here.
account = "aip-amw8"

[venvs]
# uv extras baked into each of the two shared venvs. Both are deps-only and reused by
# every commit; they re-sync automatically when uv.lock changes. Add "atari" to the
# list that needs it (that also runs scripts/install_ale_wheel.sh).
cpu = []
gpu = ["cuda", "atari"]

[slurm]
# Applied to every job, per array task.
time = "01:00:00"
cpus_per_task = 1
mem_per_cpu = "4G"

# GPUs per task, and what selects the venv: 0 uses the cpu venv, anything higher uses
# the gpu one. Keep it at 0 for this repo's jax MLP sweeps - they are CPU work, and an
# 18-task array would otherwise hold 18 GPUs idle for the whole walltime.
gpus = 0

# Per-experiment overrides, keyed by the LABEL in that experiment's config.py. Each
# table is merged over [slurm] above.

[experiments.atari_20m]
# 12.5M-step Pong on the ale-py XLA env: genuinely CUDA-bound. Smoke-tested at
# ~1,234 steps/s on an L40S -> ~2h49m for 12.5M steps, which leaves only ~10min
# under the 3h priority-bucket cutoff. This harness has no mid-run checkpointing
# (one jax.lax.scan for the whole run), so a timeout loses the entire job rather
# than a partial result - hence 5h in the 12h bucket, ~1.8x the estimate.
time = "05:00:00"
gpus = 1
mem_per_cpu = "8G"
